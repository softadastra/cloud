name: Deploy Softadastra Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: softadastra-cloud-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 45m
          script: |
            set -euo pipefail

            cd /home/gaspard/softadastra/cloud

            git fetch origin main
            git reset --hard origin/main

            chmod +x deploy.sh
            ./deploy.sh
